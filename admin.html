<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MBSS Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .login-box,
        .dashboard {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #111;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .dashboard {
            display: none;
        }

        .contact-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .contact-card h3 {
            margin: 0 0 8px;
        }

        .contact-card p {
            margin: 6px 0;
        }
    </style>
</head>

<body>

<header>
    <h1>MBSS Technologies</h1>
    <p>Admin Messages Dashboard</p>
</header>

<div class="container">

    <div class="login-box" id="loginBox">

        <h2>Admin Login</h2>

        <input
            type="password"
            id="adminKey"
            placeholder="Enter Admin Key"
        >

        <button onclick="loadMessages()">
            Login & View Messages
        </button>

        <p id="message"></p>

    </div>


    <div class="dashboard" id="dashboard">

        <h2>Contact Messages</h2>

        <div id="messagesContainer">
            Loading messages...
        </div>

    </div>

</div>


<script>

async function loadMessages() {

    const adminKey =
        document.getElementById("adminKey").value;

    const message =
        document.getElementById("message");

    if (!adminKey) {

        message.textContent =
            "Please enter the admin key.";

        return;

    }

    try {

        const response = await fetch(
            "https://mbss-backend-api.onrender.com/api/contact",
            {
                method: "GET",

                headers: {
                    "X-Admin-Key": adminKey
                }
            }
        );

        if (response.status === 401) {

            message.textContent =
                "Invalid admin key.";

            return;

        }

        if (!response.ok) {

            message.textContent =
                "Failed to load messages.";

            return;

        }

        const contacts =
            await response.json();

        document.getElementById("loginBox")
            .style.display = "none";

        document.getElementById("dashboard")
            .style.display = "block";

        const container =
            document.getElementById("messagesContainer");

        if (contacts.length === 0) {

            container.innerHTML =
                "<p>No messages found.</p>";

            return;

        }

        container.innerHTML = "";

        contacts.forEach(contact => {

            const card =
                document.createElement("div");

            card.className =
                "contact-card";

            card.innerHTML = `
                <h3>${contact.name}</h3>
                <p><strong>Email:</strong>
                    ${contact.email}
                </p>
                <p><strong>Message:</strong>
                    ${contact.message}
                </p>
                <p><strong>ID:</strong>
                    ${contact.id}
                </p>
            `;

            container.appendChild(card);

        });

    } catch (error) {

        console.error(error);

        message.textContent =
            "Cannot connect to backend.";

    }

}

</script>

</body>
</html>
